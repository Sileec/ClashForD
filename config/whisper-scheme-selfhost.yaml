mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  # 回环：供 AltLoad/SideStore 连回本机（10.7.0.1:49152），2026-11-09
  loopback-address:
  - 10.7.0.1
  dns-hijack:
  - any:53
dns:
  enable: true
  respect-rules: true
  ipv6: true
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 2400:3200::1
  nameserver:
  - https://dns.cloudflare.com/dns-query
  - https://dns.google/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    dns.cloudflare.com:
    - 1.1.1.1
    - 1.0.0.1
    dns.google:
    - 8.8.8.8
    - 8.8.4.4
    dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
    doh.pub:
    - 1.12.12.12
    - 120.53.53.53
    geosite:cn:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
  - https://anycast.uncensoreddns.org/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 127.0.0.0/8
    - 0.0.0.0/32
  fake-ip-filter:
  - geosite:cn
  - '*.lan'
  - '*.local'
  - localhost
  - '*.msftconnecttest.com'
  - '*.msftncsi.com'
  - '*.msidentity.com'
  - captive.apple.com
  - '*.push.apple.com'
  - stun.*
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - speedtest.net
  - +.r2.cloudflarestorage.com
profile:
  store-selected: true
  store-fake-ip: true
proxy-groups:
- name: PROXY-Gate
  type: select
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Final.png
  proxies:
  - 🖥️ All-Nodes
  - 🌍 Auto
  - DIRECT
- name: Apple Push
  type: fallback
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Apple.png
  proxies:
  - Apple
  - DIRECT
  url: https://captive.apple.com/hotspot-detect.html
  interval: 900
- name: 🖥️ All-Nodes
