# ============================================================
# Phase 1：kiki 同层级——从 blackmatrix7 抓源，本地转 MRS
#
# 链条：blackmatrix7/ios_rule_script（上游，2026-10-28 起冻结，2026 年底停更）
#         → filter 脚本（scripts/，kiki 开源，原样引入）
#         → mihomo convert-ruleset 转 MRS
#         → commit 到本仓库 rules/
# kiki 已从链条中摘除。ACL4SSR 的 3 个文件沿用直接同步（kiki 也不产它们）。
#
# 例外（自聚合，不走 BM7）：AdvertisingLite 与 Privacy 由
# scripts/aggregate-ads.py 从 ACL4SSR + skk.moe + anti-AD + NobyDa
# 多源聚合（方案 C 第一步，2026-11-13）。filter-alibaba.py 的逻辑
# 已内嵌进聚合脚本，workflow 不再单独调用它。
#
# 例外（meta-rules-dat，不走 BM7）：12 个服务类 MRS 由
# scripts/build-services.py 从 MetaCubeX/meta-rules-dat 的 BundleMRS.7z
# 取 geosite 数据（方案 C 第二步，2026-11-13）。supplements/ 下的
# 3 个小文件补 geosite 缺的条目（iCloud 9 条、Microsoft 1 条、Threads 1 条）。
# filter-icloud.py、filter_*.py、sync-threads.py 不再被 workflow 调用，保留在仓库中。
#
# 冻结（BM7 最后一版，不再重建，文件保留在 rules/ 中）：
# Apple.yaml（classical：关键词 + IP 段，稳定）、Netflix_IP.mrs
# （QiuSimons 1,119 条 CIDR，geoip netflix 仅 122 条）、Copilot_Domain.mrs
# 与 Copilot_IP.mrs（走 Microsoft 组，核心域名已被 geosite microsoft 覆盖）、
# ChinaMax 三件套（方案 C 第三步，2026-11-13：国内域名与 IP 段稳定；
# ChinaMax_IP 含 5,098 条 CDN 任播前缀，纯 geoip cn 覆盖不到，冻结更稳）。
# 自此 workflow 不再从 blackmatrix7 拉取任何文件。
#
# 放置：仓库 .github/workflows/update-rules.yml
# 依赖：仓库 scripts/ 下的 filter 脚本 + sync-threads.py + aggregate-ads.py
#       + build-services.py；supplements/ 下的 3 个补充文件
# 手动触发：Actions 页 "Run workflow"
# ============================================================

name: Update Rules

on:
  schedule:
    - cron: "0 6 * * *"   # 每天 UTC 06:00（北京时间 14:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare directories
        run: mkdir -p rules .tmp

      - name: Download mihomo
        run: |
          wget -O mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v1-v1.19.31.gz
          gzip -d mihomo.gz
          chmod +x mihomo

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: python -m pip install PyYAML==6.0.2 py7zr==1.0.0

      # ---------------- 服务类源（meta-rules-dat BundleMRS） ----------------
      - name: Download meta-rules-dat BundleMRS
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o .tmp/BundleMRS.7z \
            https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/BundleMRS.7z \
            && echo "ok BundleMRS.7z ($(stat -c%s .tmp/BundleMRS.7z) bytes)"

      # ---------------- 广告/隐私源（自聚合，不走 BM7） ----------------
      - name: Download ad/privacy sources
        run: |
          set -euo pipefail
          mkdir -p .tmp/ads
          cd .tmp/ads
          A=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash
          for f in BanEasyPrivacy.list BanAD.list BanEasyList.list BanEasyListChina.list; do
            curl -fsSL --retry 3 -o "$f" "$A/$f" && echo "ok $f"
          done
          curl -fsSL --retry 3 -o reject-drop.conf \
            https://ruleset.skk.moe/List/non_ip/reject-drop.conf && echo "ok reject-drop.conf"
          curl -fsSL --retry 3 -o reject-no-drop.conf \
            https://ruleset.skk.moe/List/non_ip/reject-no-drop.conf && echo "ok reject-no-drop.conf"
          curl -fsSL --retry 3 -o anti-ad-domains.txt \
            https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt \
            && echo "ok anti-ad-domains.txt"
          curl -fsSL --retry 3 -o NobyDa-AD_Block.txt \
            https://raw.githubusercontent.com/NobyDa/ND-AD/master/Surge/AD_Block.txt \
            && echo "ok NobyDa-AD_Block.txt"
          cd ../..

      # ---------------- ACL4SSR（直接同步，不经转制） ----------------
      - name: Sync ACL4SSR MRS
        run: |
          set -euo pipefail
          cd rules
          A=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/mrs
          for f in BanAD_domain.mrs BanProgramAD_domain.mrs BanProgramAD_ip.mrs; do
            curl -fsSL --retry 3 -o "$f" "$A/$f" && echo "ok $f"
          done
          cd ..

      # ---------------- 服务类：meta-rules-dat geosite + 转 MRS ----------------
      - name: Build service rules
        run: |
          set -euo pipefail
          python3 scripts/build-services.py \
            --bundle-7z .tmp/BundleMRS.7z \
            --supplements supplements \
            --mihomo ./mihomo \
            --out rules/ \
            --tmp .tmp/services

      # ---------------- 广告/隐私：自聚合 + 转 MRS ----------------
      - name: Aggregate ad/privacy lists
        run: |
          set -euo pipefail
          python3 scripts/aggregate-ads.py --src .tmp/ads --out .tmp/ads-out \
            --with-anti-ad --with-nobyda
          cp .tmp/ads-out/Privacy.yaml rules/Privacy.yaml
          cp .tmp/ads-out/AdvertisingLite.yaml rules/AdvertisingLite.yaml
          ./mihomo convert-ruleset domain yaml \
            .tmp/ads-out/Privacy_Domain.yaml rules/Privacy_Domain.mrs
          ./mihomo convert-ruleset domain yaml \
            .tmp/ads-out/AdvertisingLite_Domain.yaml rules/AdvertisingLite_Domain.mrs

      # ---------------- 校验 ----------------
      - name: Sanity check
        run: |
          echo "files in rules/: $(ls rules/ | wc -l) (expect 26)"
          test "$(ls rules/ | wc -l)" -eq 26
          if grep -l -i "<html" rules/* 2>/dev/null; then
            echo "ERROR: HTML content detected"; exit 1
          fi
          ls -la rules/

      # ---------------- 清理并提交 ----------------
      - name: Cleanup and commit
        run: |
          rm -rf .tmp mihomo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/
          git diff --cached --quiet || git commit -m "chore: rebuild rules from upstream"
          git push
